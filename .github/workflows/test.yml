name: test

on:
  push:
    branches: ['**']
    tags: ['**', '!v*']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GOCACHE: ${{ github.workspace }}/.gocache
  GOMODCACHE: ${{ github.workspace }}/.gomodcache
  GOTOOLCHAIN: go1.25.10
  CGO_ENABLED: '0'

jobs:
  native:
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.10'
          cache: false
      - run: make test
      - run: make build

  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.10'
          cache: false
      - run: make test-release
      - run: make release-all VERSION=v0.0.0-test COMMIT=${{ github.sha }}
      - run: bash .github/scripts/release.sh check-assets dist
        env:
          RELEASE_TAG: v0.0.0-test
      - run: make verify-repro
